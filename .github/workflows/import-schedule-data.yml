name: Import university schedule datasets

on:
  workflow_dispatch:
    inputs:
      university:
        description: University datasets to refresh
        type: choice
        required: true
        default: all
        options:
          - all
          - bru
          - bsu
      profile_type:
        description: Profile catalogues to refresh (split groups and teachers to fit the import time limit)
        type: choice
        required: true
        default: all
        options:
          - all
          - groups
          - teachers

permissions:
  actions: write
  contents: write

concurrency:
  group: schedule-data-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-and-publish:
    name: Parse schedules and publish GitHub datasets
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the import is running on a branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Run this workflow from a branch; refusing to publish from $GITHUB_REF"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Import current published schedules with the existing KMP parsers
        env:
          SCHEDULE_DATA_IMPORT: 'true'
          SCHEDULE_DATA_UNIVERSITY: ${{ inputs.university || 'all' }}
          SCHEDULE_DATA_PROFILE_TYPE: ${{ inputs.profile_type || 'all' }}
          SCHEDULE_REPOSITORY_ROOT: ${{ github.workspace }}
          SCHEDULE_DATA_ROOT: ${{ github.workspace }}/schedule-data
          SCHEDULE_SOURCE_HTTP_PROXY: ${{ secrets.SCHEDULE_SOURCE_HTTP_PROXY }}
          SCHEDULE_SOURCE_READER_FALLBACK: 'true'
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "ANDROID_HOME and ANDROID_SDK_ROOT are both unset"
            exit 1
          fi
          run_import() {
            bash gradlew :androidApp:testDebugUnitTest --tests com.example.bruschedule.tools.ScheduleDataImporterTest --no-daemon
          }
          run_import_without_metadata_check() {
            bash gradlew :androidApp:testDebugUnitTest --tests com.example.bruschedule.tools.ScheduleDataImporterTest -x :androidApp:checkDebugAarMetadata --no-daemon
          }
          if [ -d "$ANDROID_SDK/platforms/android-37" ]; then
            run_import
          else
            SDKMANAGER="$(find "$ANDROID_SDK"/cmdline-tools -type f -name sdkmanager -print -quit 2>/dev/null || true)"
            if [ -n "$SDKMANAGER" ]; then
              yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null 2>&1 || true
              if "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --channel=3 --install "platforms;android-37"; then
                run_import
              elif [ -d "$ANDROID_SDK/platforms/android-34" ]; then
                sed -i 's/^android-compileSdk = "37"$/android-compileSdk = "34"/; s/^android-targetSdk = "37"$/android-targetSdk = "34"/' gradle/libs.versions.toml
                run_import_without_metadata_check
              else
                echo "Android API 37 is unavailable, and no API 34 fallback is installed"
                exit 1
              fi
            elif [ -d "$ANDROID_SDK/platforms/android-34" ]; then
              sed -i 's/^android-compileSdk = "37"$/android-compileSdk = "34"/; s/^android-targetSdk = "37"$/android-targetSdk = "34"/' gradle/libs.versions.toml
              run_import_without_metadata_check
            else
              echo "sdkmanager was not found, and no API 34 fallback is installed"
              exit 1
            fi
          fi

      - name: Validate schedule datasets
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/schedules/tests -v
          python3 tools/schedules/validate_schedule_data.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("schedule-data/import-report.json").read_text(encoding="utf-8"))
          expected_profile_types = report.get("profile_types", ["groups", "teachers"])
          if not expected_profile_types or any(profile_type not in ("groups", "teachers") for profile_type in expected_profile_types):
              raise SystemExit(f"Invalid profile_types in import report: {expected_profile_types!r}")
          print(
              "Import summary: "
              f"{report['discovered_profiles']} discovered, "
              f"{report['imported_profiles']} imported, "
              f"{report['preserved_profiles']} preserved, "
              f"{report['skipped_profiles']} skipped; "
              f"catalogues: {', '.join(expected_profile_types)}"
          )
          if "bsu" in report.get("universities", []):
              sources = [
                  source for source in report.get("catalogue_sources", [])
                  if source.get("university") == "bsu" and source.get("source") != "Оффлайн-реестр"
              ]
              incomplete = [
                  source for source in sources
                  if source.get("request_failures", 0) > 0 or source.get("source_unavailable", False)
                  or source.get("crawl_truncated", False)
              ]
              source_type_counts = {
                  profile_type: sum(source.get("type") == profile_type for source in sources)
                  for profile_type in expected_profile_types
              }
              print(
                  "BSU catalogue source reports: "
                  + ", ".join(f"{profile_type}={count}" for profile_type, count in source_type_counts.items())
              )
              missing_source_types = [
                  profile_type for profile_type, count in source_type_counts.items() if count != 27
              ]
              failed_profiles = [
                  failure for failure in report.get("failures", [])
                  if failure.get("university") == "bsu"
                  and failure.get("type") in expected_profile_types
                  and failure.get("category") != "no_lessons_in_period"
              ]
              if incomplete or missing_source_types or failed_profiles:
                  print(
                      "::error::Refusing to publish incomplete BSU schedules: "
                      f"{len(incomplete)} source errors, {len(missing_source_types)} incomplete source types, "
                      f"{len(failed_profiles)} profile import failures."
                  )
                  for source in incomplete:
                      details = "; ".join(source.get("request_failure_details", [])).replace(chr(10), " ").replace(chr(13), " ").replace("\\n", " ")
                      print(
                          f"::error title=Incomplete {source.get('type')} source::{source.get('source')}: "
                          f"{source.get('request_failures')} failed requests; "
                          f"crawl_truncated={source.get('crawl_truncated')}; {details}"
                      )
                  for profile_type in missing_source_types:
                      count = sum(source.get("type") == profile_type for source in sources)
                      print(f"::error::Expected 27 BSU {profile_type} sources, found {count}.")
                  for failure in failed_profiles:
                      print(
                          f"::error title=Unavailable BSU profile::{failure.get('type')} "
                          f"{failure.get('profile')}: {failure.get('category')} — {failure.get('reason')}"
                      )
                  raise SystemExit(1)
          PY

      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schedule-import-diagnostics-${{ github.run_id }}
          path: |
            schedule-data/import-report.json
            schedule-data/universities/bsu/groups/index.csv
            schedule-data/universities/bsu/teachers/index.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and publish updated datasets to the selected branch
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          if [[ "$branch" == "$GITHUB_REF" || -z "$branch" ]]; then
            echo "::error::Refusing to publish schedule data outside a branch: $GITHUB_REF"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          imported_data="$RUNNER_TEMP/imported-schedule-data"
          imported_bsu_registry="$RUNNER_TEMP/imported-bsu-registry"
          mkdir -p "$imported_data" "$imported_bsu_registry"
          cp -a schedule-data/. "$imported_data/"
          cp -a tools/schedules/registry/bsu/. "$imported_bsu_registry/"

          for attempt in 1 2 3; do
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            publish_dir="$RUNNER_TEMP/schedule-data-publish-${attempt}"
            git worktree add --detach "$publish_dir" "refs/remotes/origin/${branch}"
            git -C "$publish_dir" config user.name "github-actions[bot]"
            git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$publish_dir" rm -r --ignore-unmatch --quiet schedule-data
            mkdir -p "$publish_dir/schedule-data"
            cp -a "$imported_data"/. "$publish_dir/schedule-data/"
            rm -rf "$publish_dir/tools/schedules/registry/bsu"
            mkdir -p "$publish_dir/tools/schedules/registry/bsu"
            cp -a "$imported_bsu_registry"/. "$publish_dir/tools/schedules/registry/bsu/"
            git -C "$publish_dir" add -- schedule-data/ tools/schedules/registry/bsu/

            if git -C "$publish_dir" diff --cached --quiet; then
              echo "No schedule dataset changes to publish"
              git worktree remove "$publish_dir"
              exit 0
            fi

            git -C "$publish_dir" commit -m "Update published university schedule datasets"
            if git -C "$publish_dir" push origin "HEAD:${GITHUB_REF}"; then
              git worktree remove "$publish_dir"
              exit 0
            fi
            git worktree remove "$publish_dir"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not publish schedule data after three attempts."
              exit 1
            fi
            echo "Push was rejected because the branch advanced; rebuilding the publish commit on the latest ${branch} (attempt $((attempt + 1))/3)."
          done

      - name: Deploy published datasets to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
