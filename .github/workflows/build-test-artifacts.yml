name: Build test artifacts

on:
  push:
    branches:
      - arena/a130e7c0-bru-schedule
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build installable debug APK
        run: |
          set -euo pipefail
          LOG_PATH="$RUNNER_TEMP/android-build.log"
          {
            ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [ -z "$ANDROID_SDK" ]; then
              echo "ANDROID_HOME and ANDROID_SDK_ROOT are both unset"
              exit 1
            fi
            echo "Using Android SDK at $ANDROID_SDK"
            echo "Preinstalled Android platforms:"
            find "$ANDROID_SDK/platforms" -mindepth 1 -maxdepth 1 -type d -print 2>/dev/null || true
            if [ -d "$ANDROID_SDK/platforms/android-37" ]; then
              echo "Building with Android API 37"
            elif [ -d "$ANDROID_SDK/platforms/android-34" ]; then
              echo "Android API 37 is unavailable on the hosted runner; using API 34 for this test APK"
              sed -i 's/^android-compileSdk = "37"$/android-compileSdk = "34"/; s/^android-targetSdk = "37"$/android-targetSdk = "34"/' gradle/libs.versions.toml
            else
              echo "Neither Android API 37 nor API 34 is installed on this runner"
              exit 1
            fi
            bash gradlew :androidApp:assembleDebug --no-daemon
          } 2>&1 | tee "$LOG_PATH"

      - name: Report Android build errors
        if: failure()
        env:
          BUILD_LOG: ${{ runner.temp }}/android-build.log
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path(os.environ["BUILD_LOG"])
          if not log.exists():
              print("::error::Android build failed before a log file was created")
          else:
              lines = log.read_text(errors="replace").splitlines()
              anchors = [i for i, line in enumerate(lines) if re.search(r"error:|failed|failure|exception|not found|could not|http [45][0-9][0-9]|aar metadata|compile.?sdk|minCompileSdk", line, re.I)]
              selected_indices = sorted({j for i in anchors[-15:] for j in range(max(0, i - 2), min(len(lines), i + 3))})
              selected = [lines[i] for i in selected_indices] if selected_indices else lines[-40:]
              for line in selected[-45:]:
                  escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Android build log::{escaped}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bru-schedule-android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios-simulator:
    name: iOS Simulator app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build for Apple Silicon iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BRUScheduleDerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Report iOS build errors
        if: failure()
        env:
          BUILD_LOG: ${{ runner.temp }}/ios-build.log
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path(os.environ["BUILD_LOG"])
          if not log.exists():
              print("::error::iOS build failed before a log file was created")
          else:
              lines = log.read_text(errors="replace").splitlines()
              anchors = [i for i, line in enumerate(lines) if re.search(r"error:|failed|failure|exception|unresolved reference|no value passed|cannot be reassigned|undefined symbols|symbol not found|library not found|framework not found|duplicate symbol|ld:", line, re.I)]
              selected_indices = sorted({j for i in anchors[-15:] for j in range(max(0, i - 6), min(len(lines), i + 3))})
              selected = [lines[i] for i in selected_indices] if selected_indices else lines[-40:]
              for line in selected[-45:]:
                  escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=iOS build log::{escaped}")
          PY

      - name: Package Simulator app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/BRUScheduleDerivedData/Build/Products/Debug-iphonesimulator/BRUSchedule.app"
          "$RUNNER_TEMP/BRUSchedule-iOS-Simulator.zip"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: bru-schedule-ios-simulator-app
          path: ${{ runner.temp }}/BRUSchedule-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
